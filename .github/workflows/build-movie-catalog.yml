name: Build Movie Catalog

on:
  workflow_dispatch:

  schedule:
    - cron: "17 17 * * 1"

permissions:
  contents: write

concurrency:
  group: build-movie-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    name: Build TMDb Movie Catalog
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm catalog script exists
        run: |
          test -f scripts/build-movie-catalog.mjs
          echo "Catalog script found."

      - name: Build catalog from TMDb
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: node scripts/build-movie-catalog.mjs

      - name: Commit updated catalog files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add movie-catalog.json catalog-coverage.json

          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "Update TMDb movie catalog"

            git pull --rebase origin main

            git push origin HEAD:main
          fi
